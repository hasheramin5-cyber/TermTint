[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termtint"
version = "0.4.0"
description = "A lightweight, zero-dependency Python library for simple colored and styled terminal output."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "TermTint Contributors"}
]
keywords = ["terminal", "color", "ansi", "cli", "console", "formatting", "termtint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/hasheramin5-cyber/TermTint"
Repository = "https://github.com/hasheramin5-cyber/TermTint"
Issues = "https://github.com/hasheramin5-cyber/TermTint/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
termtint = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
